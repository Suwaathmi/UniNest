version: '3.8'

services:
  frontend:
    image: suwaathmi/uninest-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    image: suwaathmi/uninest-backend:latest
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/uninest

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
