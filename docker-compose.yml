version: '3.8'

services:
  # Auth Service
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: uninest-auth
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - JWT_SECRET=${JWT_SECRET:-your-production-secret-key}
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_NAME=myapp
      - DB_USER=root
      - DB_PASS=example
    depends_on:
      - mongodb
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - ./auth:/app
      - /app/node_modules

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uninest-frontend
    ports:
      - "3000:80"
    depends_on:
      - auth
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # Backend Service (for other APIs)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uninest-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_NAME=myapp
      - DB_USER=root
      - DB_PASS=example
    depends_on:
      - mongodb
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules

  # MongoDB Service
  mongodb:
    image: mongo:6
    container_name: uninest-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
      - MONGO_INITDB_DATABASE=myapp
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    restart: unless-stopped
    command: ["mongod", "--auth"]

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: uninest-nginx
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - auth
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
